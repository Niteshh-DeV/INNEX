<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <script>
      // Launch loader: first visit per session (or any visit with ?boot), never for
      // reduced motion. `data-booting` is the single flag the app reads (see BootLoader.tsx).
      (function () {
        var seen = false
        try {
          seen = !!sessionStorage.getItem("innex-loader-seen")
        } catch (e) {
          // Storage blocked (e.g. sandboxed preview): treat as a first visit.
        }
        var forced = /[?&]boot\b/.test(location.search)
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches
        if ((forced || !seen) && !reduce) document.documentElement.setAttribute("data-booting", "")
      })()
    </script>
    <style>
      /* Paints before any JS: navy screen + amber cursor where the boot lines will type. */
      #boot-splash { display: none; }
      html[data-booting] { background: #14214f; }
      html[data-booting] body { overflow: hidden; }
      html[data-booting] #boot-splash {
        display: block; position: fixed; inset: 0; z-index: 100; background: #14214f;
      }
      #boot-splash span {
        position: absolute; left: 24px; top: calc(50% - 56px + 18px);
        width: 9px; height: 2px; background: #f9a53c;
        animation: boot-blink 1.1s steps(1, end) infinite;
      }
      @media (min-width: 768px) { #boot-splash span { left: 40px; } }
      @media (min-width: 1024px) { #boot-splash span { left: 80px; } }
      @keyframes boot-blink { 56% { opacity: 0; } }
    </style>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="boot-splash" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
